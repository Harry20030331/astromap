name: astramap-api
region: sfo

services:
  - name: api
    environment_slug: python
    github:
      repo: Harry20030331/astromap
      branch: main
      deploy_on_push: true
    source_dir: services/api
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /live
    envs:
      - key: PYTHON_VERSION
        value: "3.11.8"
        scope: RUN_AND_BUILD_TIME
      - key: OPENAI_MODEL
        value: gpt-5.4
        scope: RUN_TIME
      - key: OPENAI_WHISPER_MODEL
        value: whisper-1
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: SUPABASE_URL
        type: SECRET
        scope: RUN_TIME
      - key: SUPABASE_SERVICE_KEY
        type: SECRET
        scope: RUN_TIME
      - key: CORS_ORIGINS
        type: SECRET
        scope: RUN_TIME
      - key: GEONAMES_USERNAME
        type: SECRET
        scope: RUN_TIME
